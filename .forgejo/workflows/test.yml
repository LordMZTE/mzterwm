on: [push]

jobs:
  test:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Zig
        uses: actions/setup-zig@v2
        with:
          version: 0.15.1

      - name: Setup Packages
        run: |
          apt update
          apt install -y pkg-config libwayland-dev wayland-protocols libxkbcommon-dev

      - name: Build & Test
        run: |
          zig fmt --check .
          zig build test
